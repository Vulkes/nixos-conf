exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent
exec-once=mullvad-vpn
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
exec-once=hyprctl setcursor Bibata-Modern-Ice 24
exec-once=noctalia-shell -d

exec-once=[workspace 2 silent] firefox
windowrule=match:title (Vesktop)$, workspace 3 silent
exec-once=[workspace 3 silent] vesktop --enable-features=UseOzonePlatform --ozone-platform=wayland 
exec-once=[workspace 5 silent] spotify --enable-features=UseOzonePlatform --ozone-platform=wayland 


# exec-once = kdeconnectd&
# exec-once = sleep 2s && kdeconnect-indicator&
